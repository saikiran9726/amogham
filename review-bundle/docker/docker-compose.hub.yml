version: '3.8'

services:
  # Local PostgreSQL Database bound strictly to loopback (127.0.0.1)
  hub-db:
    image: postgres:16-alpine
    container_name: restaurant-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_hub}
    volumes:
      - hub_pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-restaurant_hub}']
      interval: 5s
      timeout: 5s
      retries: 5

  # Separate Migration Service that runs before the API starts
  hub-migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: restaurant-hub-migrate
    restart: 'no'
    init: true
    user: '1000:1000'
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      hub-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@hub-db:5432/${POSTGRES_DB:-restaurant_hub}
    command: ['node', 'dist/db/migrate.js', 'up']

  # Local Hub API (Fastify + Realtime Socket.IO + HubSyncWorker)
  hub-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: restaurant-hub-api
    restart: unless-stopped
    init: true
    user: '1000:1000'
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      hub-db:
        condition: service_healthy
      hub-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@hub-db:5432/${POSTGRES_DB:-restaurant_hub}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-strict}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      HUB_ROLE: local_hub
      CLOUD_SYNC_URL: ${CLOUD_SYNC_URL:-https://cloud.restaurant-os.internal}
      RESTAURANT_ID: ${RESTAURANT_ID:?RESTAURANT_ID is required}
      HUB_DEVICE_ID: ${HUB_DEVICE_ID:-hub-local-01}
      HUB_API_KEY: ${HUB_API_KEY:?HUB_API_KEY is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://hub.restaurant-os.internal}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      UV_THREADPOOL_SIZE: 8
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Automated Database Backup Cron Service
  hub-backup:
    image: postgres:16-alpine
    container_name: restaurant-hub-backup
    restart: unless-stopped
    depends_on:
      hub-db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    environment:
      PGHOST: hub-db
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-restaurant_hub}
      BACKUP_DIR: /backups
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
    entrypoint:
      ['/bin/sh', '-c', 'chmod +x /backup.sh && while true; do /backup.sh; sleep 86400; done']

volumes:
  hub_pgdata:
    name: restaurant_hub_pgdata
