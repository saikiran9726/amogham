name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  audit:
    name: Dependency Audit & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production Audit (High & Critical)
        run: pnpm audit --prod --audit-level=high

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  validate:
    name: Lint, Typecheck, Test, Coverage & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restaurant_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run migrations for tests
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/restaurant_os_test

      - name: Run tests with Coverage and Zero-Skip Assertion
        run: |
          set -euo pipefail
          # Execute vitest with JSON reporter and fail if any tests are skipped
          pnpm exec vitest run --coverage --reporter=default --reporter=json --outputFile=vitest-report.json
          
          node -e '
            const report = require("./vitest-report.json");
            const numFailed = report.numFailedTestSuites || 0;
            const numPending = report.numPendingTestSuites || 0;
            const numTotal = report.numTotalTestSuites || 0;
            console.log(`Test suites: Total=${numTotal}, Failed=${numFailed}, Skipped/Pending=${numPending}`);
            if (numFailed > 0) {
              console.error(`ERROR: ${numFailed} test suites failed!`);
              process.exit(1);
            }
            if (numPending > 0) {
              console.error(`ERROR: ${numPending} test suites were skipped! Isolated test db must run all suites.`);
              process.exit(1);
            }
          '
        env:
          RESTAURANT_OS_ISOLATED_TEST_DB: restaurant_os_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/restaurant_os_test
          PORT: 4000
          HOST: 0.0.0.0
          NODE_ENV: test
          LOG_LEVEL: silent
          CORS_ORIGIN: http://localhost:5173

      - name: Build packages and apps
        run: pnpm build

  docker-api-smoke:
    name: Docker API Build & Container Smoke Test
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API Docker Image
        run: docker build -f apps/api/Dockerfile -t restaurant-os-api:test .

      - name: Run API Container & Smoke Test /readyz
        run: |
          set -euo pipefail
          docker run -d --name api-smoke \
            -e PORT=4000 \
            -e HOST=0.0.0.0 \
            -e NODE_ENV=production \
            -e JWT_SECRET=smoke-test-jwt-secret-minimum-32-chars-long \
            -e COOKIE_SECRET=smoke-test-cookie-secret-min-32-chars-long \
            -e DATABASE_URL=postgres://dummy:dummy@127.0.0.1:5432/dummy \
            -p 4000:4000 \
            restaurant-os-api:test

          sleep 5
          docker ps
          # Hit /healthz / ready check
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:4000/healthz
          docker stop api-smoke
          docker rm api-smoke

  playwright-e2e:
    name: Playwright E2E & Axe Accessibility
    runs-on: ubuntu-latest
    needs: [validate]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restaurant_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run migrations & seed DB for E2E
        run: |
          pnpm db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/restaurant_os_test

      - name: Build Web & API
        run: pnpm build

      - name: Run Playwright Tests
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/restaurant_os_test
          CI: true
